name: Publish CMS Blog Articles
on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
      - 'assets/images/blog/uploads/**'
      - 'scripts/build_blog.py'
      - '.github/workflows/publish-blog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependencies
        run: pip install markdown PyYAML
      - name: Build blog HTML and sitemap
        run: python scripts/build_blog.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.html sitemap.xml
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Build blog pages from CMS content [skip ci]"
            git push
          fi
