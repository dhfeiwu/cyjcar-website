media:
  input: assets/images/blog/uploads
  output: /assets/images/blog/uploads
content:
  - name: posts
    label: Blog Articles
    type: collection
    path: content/posts
    filename: '{primary}.md'
    view:
      fields: [title, slug, date, category]
      primary: slug
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: slug
        label: URL slug (lowercase words separated by hyphens)
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
      - name: category
        label: Category
        type: string
        default: SOURCING GUIDE
      - name: description
        label: SEO description / summary
        type: text
        required: true
      - name: cover
        label: Cover image (optional)
        type: image
      - name: body
        label: Article body
        type: rich-text
        required: true
